<!doctype html>
<html lang="en">
  <head>
    <!-- =========================
         BASIC DOCUMENT METADATA
         ========================= -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="KinFeast is your place to discover delicious recipes, explore new dishes, and find inspiration for your next meal."
    />

    <meta
      name="keywords"
      content="recipes, food, cooking, meals, dishes, healthy recipes, easy recipes, dinner recipes, lunch recipes, breakfast recipes, dessert recipes, cooking ideas, meal ideas"
    />

    <meta name="author" content="Abdullah Sameh" />

    <meta name="publisher" content="Abdullah Sameh" />

    <meta name="application-name" content="KinFeast" />

    <meta name="generator" content="Abdullah Sameh" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta name="color-scheme" content="light dark" />

    <!-- =========================
         SEARCH ENGINE / ROBOTS
         ========================= -->

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="bingbot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =========================
         CANONICAL URL
         ========================= -->

    <link rel="canonical" href="https://kinfeast.com/" />

    <!-- =========================
         FAVICON / ICONS
         ========================= -->

    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- =========================
         THEME / BROWSER UI
         ========================= -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />

    <meta
      name="theme-color"
      content="#0B2D17"
      media="(prefers-color-scheme: dark)"
    />

    <meta
      name="msapplication-TileColor"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />

    <meta
      name="msapplication-TileColor"
      content="#0B2D17"
      media="(prefers-color-scheme: dark)"
    />

    <!-- =========================
         OPEN GRAPH / FACEBOOK /
         LINK PREVIEWS
         ========================= -->

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="KinFeast" />

    <meta property="og:title" content="KinFeast - Discover Delicious Recipes" />

    <meta
      property="og:description"
      content="Discover delicious recipes, explore new dishes, and find inspiration for your next meal with KinFeast."
    />

    <meta property="og:url" content="https://kinfeast.com/" />

    <meta property="og:image" content="https://kinfeast.com/og-image.png" />

    <meta
      property="og:image:secure_url"
      content="https://kinfeast.com/og-image.jpg"
    />

    <meta property="og:image:type" content="image/png" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="KinFeast - Discover delicious recipes"
    />

    <meta property="og:locale" content="en_US" />

    <!-- =========================
         X / TWITTER CARD
         ========================= -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="KinFeast - Discover Delicious Recipes"
    />

    <meta
      name="twitter:description"
      content="Discover delicious recipes, explore new dishes, and find inspiration for your next meal with KinFeast."
    />

    <meta name="twitter:image" content="https://kinfeast.com/og-image.png" />

    <meta
      name="twitter:image:alt"
      content="KinFeast - Discover delicious recipes"
    />

    <!-- =========================
         MOBILE / APP METADATA
         ========================= -->

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="apple-mobile-web-app-title" content="KinFeast" />

    <!-- =========================
         MICROSOFT / WINDOWS
         ========================= -->

    <meta name="msapplication-TileImage" content="/mstile-144x144.png" />

    <!-- =========================
         SECURITY / PRIVACY
         ========================= -->

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- =========================
         TITLE
         ========================= -->

    <title>KinFeast - Discover Delicious Recipes</title>
  </head>

    <div id="root"></div>

</html>
